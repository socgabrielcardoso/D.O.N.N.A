name: Bootstrap D.O.N.N.A delivery

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  expand:
    if: github.event.pull_request.head.ref == 'donna/bootstrap-delivery'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout delivery branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Reconstruct and verify tested source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .donna_delivery/part-00 .donna_delivery/part-01 .donna_delivery/part-02 | base64 -d > /tmp/donna-source.tar.gz
          echo "039a772da404a2f1c4ac189b6a7f9a7c08e41fabaa78afbf1d071685020271d8  /tmp/donna-source.tar.gz" | sha256sum --check
          tar -tzf /tmp/donna-source.tar.gz >/dev/null

      - name: Expand tested source
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/donna-source.tar.gz -C .
          rm -rf .donna_bootstrap .donna_delivery
          rm -f .github/workflows/bootstrap-delivery.yml

      - name: Commit exact tested source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: deliver tested D.O.N.N.A. v0.1 source"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
